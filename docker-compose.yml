# One-command control plane: Postgres for shared coordination state plus the
# coordinator web/API process. Workers and browsers on other machines connect
# to port 4317. See docs/deployment.md for the full multi-device guide.
#
# Required in the environment (or a .env file next to this compose file):
#   POSTGRES_PASSWORD        password for the coordinator database user
#   COORD_BOOTSTRAP_TOKEN    first-run setup token, at least 24 characters
#
# That .env file is git-ignored, and it should hold COORD_CREDENTIAL_KEY too:
# without it a key is generated beside the credential file, and credentials
# stop being readable the moment that directory does not survive a restart.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coordinator
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - coordinator-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator -d coordinator"]
      interval: 5s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: .
      dockerfile: infrastructure/docker/control-plane.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COORD_DATABASE_URL: postgresql://coordinator:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/coordinator
      COORD_BOOTSTRAP_TOKEN: ${COORD_BOOTSTRAP_TOKEN:?set COORD_BOOTSTRAP_TOKEN (min 24 chars)}
      COORD_SECURE_COOKIES: ${COORD_SECURE_COOKIES:-false}
      COORD_ALLOWED_ORIGINS: ${COORD_ALLOWED_ORIGINS:-}
      # Compose forwards only what is listed here, so every optional knob the
      # control plane reads must appear or a value in .env silently does
      # nothing. Empty means each one's own default.
      COORD_CREDENTIAL_KEY: ${COORD_CREDENTIAL_KEY:-}
      COORD_CREDENTIAL_POLICY: ${COORD_CREDENTIAL_POLICY:-}
      COORD_ALLOW_REGISTRATION: ${COORD_ALLOW_REGISTRATION:-}
      # Off unless set: no checkout, no trial, and a waitlist instead of
      # self-service sign-up. See .env.example.
      KUMI_PAYMENTS_ENABLED: ${KUMI_PAYMENTS_ENABLED:-}
      # Without one of these two the sign-up code and the password reset link
      # are written to this container's log and never posted anywhere.
      COORD_MAIL_API_URL: ${COORD_MAIL_API_URL:-}
      COORD_MAIL_API_KEY: ${COORD_MAIL_API_KEY:-}
      COORD_SMTP_URL: ${COORD_SMTP_URL:-}
      COORD_MAIL_FROM: ${COORD_MAIL_FROM:-}
      COORD_PUBLIC_URL: ${COORD_PUBLIC_URL:-}
      COORD_PASSWORD_RESET_TTL_MINUTES: ${COORD_PASSWORD_RESET_TTL_MINUTES:-}
      COORD_TRUSTED_PROXY_HOPS: ${COORD_TRUSTED_PROXY_HOPS:-}
      COORD_HSTS: ${COORD_HSTS:-}
      COORD_SANDBOX_USER: ${COORD_SANDBOX_USER:-}
      COORD_GITHUB_CLIENT_ID: ${COORD_GITHUB_CLIENT_ID:-}
      COORD_REPOSITORY_PARALLELISM: ${COORD_REPOSITORY_PARALLELISM:-}
      # "1" stops the control plane executing agents itself, leaving every
      # task for a registered worker. The hosted deployment's memory and
      # egress are almost entirely agents, and both belong on the machine the
      # work is for. Off here, because a single-box install where this
      # container *is* the executor must keep working.
      COORD_LOCAL_AGENTS_ONLY: ${COORD_LOCAL_AGENTS_ONLY:-}
      # "1" sends desktop browsers asking for the dashboard to /download
      # instead. Phones are let through, because there is no phone build to
      # send them to, and the app identifies itself so it is never redirected
      # away from the page it exists to show. A signpost, not a control: the
      # marker is client-supplied and anybody can copy it.
      COORD_DESKTOP_APP_ONLY: ${COORD_DESKTOP_APP_ONLY:-}
    ports:
      - "${COORD_PORT:-4317}:4317"
    volumes:
      - coordinator-data:/data

volumes:
  coordinator-db:
  coordinator-data:
