<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Connect to Kumi</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #121110;
        color: #efe9e1;
      }
      main {
        width: 100%;
        max-width: 360px;
        display: grid;
        gap: 14px;
      }
      /* Inline rather than a file: this window opens before any server is
         known, so the only artwork it can reach is artwork it already holds. */
      .mark {
        width: 46px;
        height: 46px;
        justify-self: center;
        color: #D88973;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.02em;
        text-align: center;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #a29a90;
        text-align: center;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 12.5px;
        color: #a29a90;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        color: #efe9e1;
        background: #1b1917;
        border: 1px solid #322e2a;
        border-radius: 10px;
      }
      input:focus {
        outline: none;
        border-color: #D88973;
      }
      button {
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 550;
        color: #141312;
        background: #D88973;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #status {
        min-height: 18px;
        text-align: center;
        font-size: 12.5px;
        color: #e8907f;
      }
      #status.working {
        color: #a29a90;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor"
        stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M29.92 9.08A4.16 4.16 0 0 1 34.08 9.08L50.92 18.8A4.16 4.16 0 0 1 53 22.4L53 41.6A4.16 4.16 0 0 1 50.92 45.2L34.08 54.92A4.16 4.16 0 0 1 29.92 54.92L13.08 45.2A4.16 4.16 0 0 1 11 41.6L11 22.4A4.16 4.16 0 0 1 13.08 18.8Z"/>
        <path d="M12.25 20.72L32 32.12L51.75 20.72"/>
        <path d="M32 32.12L32 54.68"/>
        <path d="M24.16 19.07L30.39 15.47"/>
        <path d="M17.3 28.6L17.3 35.8"/>
        <path d="M39.38 45.13L45.62 41.53"/>
      </svg>
      <h1>Connect to Kumi</h1>
      <p>
        The address of your deployment. This app is a window onto it — the
        dashboard, your projects, and your agents all live there.
      </p>
      <label>
        Server address
        <input
          id="address"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://kumi.example.com"
        />
      </label>
      <button id="connect" type="button">Connect</button>
      <p id="status"></p>
    </main>
    <script>
      /**
       * One field, and a check before it counts.
       *
       * The address is confirmed against the deployment's health route before
       * it is written down, so a typo is a sentence here rather than a window
       * that opens onto nothing. The request is made by the main process — see
       * `setup-preload.mjs` for why.
       */
      const address = document.getElementById("address");
      const connect = document.getElementById("connect");
      const status = document.getElementById("status");

      async function submit() {
        const value = address.value.trim();
        if (value === "") {
          address.focus();
          return;
        }
        connect.disabled = true;
        address.disabled = true;
        status.className = "working";
        status.textContent = "Looking for Kumi at that address…";
        const answer = await window.kumiSetup.connect(value);
        // On success this window is closed from the other side, so there is
        // deliberately nothing to do here but wait for it.
        if (!answer.ok) {
          connect.disabled = false;
          address.disabled = false;
          status.className = "";
          status.textContent = answer.message;
          address.focus();
          address.select();
        }
      }

      connect.addEventListener("click", () => void submit());
      address.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          void submit();
        }
      });
      address.focus();
    </script>
  </body>
</html>
