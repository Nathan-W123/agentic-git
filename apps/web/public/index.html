<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0b0f">
    <meta
      name="description"
      content="Coordination for humans and coding agents on one live codebase."
    >
    <link rel="icon" href="/mark.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <title>Lattice</title>
  </head>
  <body>
    <!-- Both shells are written by the router; the markup here is only the
         mount point, so a screen's structure lives with its module. -->
    <div id="auth-root" hidden></div>
    <div id="app-root" hidden></div>

    <!-- Two regions, because a failure and a confirmation do not deserve the
         same urgency: errors interrupt, everything else waits its turn. -->
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="toasts toasts-alert" id="toasts-alert" role="alert"
      aria-live="assertive"></div>
    <div id="layer-root"></div>
    <dialog class="modal" id="modal"></dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
