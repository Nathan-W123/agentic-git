<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report
         anything but zero on a notched phone. The app draws its own full-bleed
         surfaces — a fixed sidebar, fixed panels, a header at the top of the
         viewport — so it opts into the whole screen and pays back the insets
         itself in styles.css. Without this the values are 0 and every
         safe-area rule silently does nothing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <!-- The page ground, not the accent: this paints the phone's status bar
         and the installed app's title bar, which sit flush against the
         header. The stylesheet's dark ground is the pre-JS paint for
         everyone (`:root` is dark until a theme attribute lands), so this
         matches it; `applyTheme` re-reads the resolved ground on every
         theme change so the chrome can never disagree with the page. -->
    <meta name="theme-color" content="#121110">
    <meta
      name="description"
      content="Coordination for humans and coding agents on one live codebase."
    >
    <meta name="apple-mobile-web-app-title" content="Kumi">
    <!-- Both spellings on purpose: the unprefixed one is the standard,
         and older iOS only honours the apple- one. Standalone display plus
         a translucent status bar is what `viewport-fit=cover` and the
         safe-area padding in styles.css were written for. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <title>Kumi</title>
  </head>
  <body>
    <!-- Auth is written by the router. The app mount starts with a real first
         paint so a slow session or project read is a shaped wait, not a blank
         page; app.js replaces this whole region when the answer arrives. -->
    <div id="auth-root" hidden></div>
    <div id="app-root" aria-busy="true">
      <div class="boot-shell" role="status" aria-live="polite"
        aria-label="Loading Kumi">
        <span class="sr-only">Loading Kumi…</span>
        <div class="boot-skeleton-rail" aria-hidden="true">
          <span class="skeleton boot-skeleton-rail-button"></span>
          <span class="skeleton boot-skeleton-rail-button"></span>
          <span class="skeleton boot-skeleton-rail-button"></span>
        </div>
        <div class="boot-skeleton-sidebar" aria-hidden="true">
          <span class="skeleton boot-skeleton-title"></span>
          <span class="skeleton boot-skeleton-search"></span>
          <div class="boot-skeleton-nav">
            <span class="skeleton"></span><span class="skeleton"></span>
            <span class="skeleton"></span><span class="skeleton"></span>
            <span class="skeleton"></span>
          </div>
        </div>
        <main class="boot-skeleton-main" aria-hidden="true">
          <header class="boot-skeleton-head">
            <span class="skeleton boot-skeleton-heading"></span>
            <span class="skeleton boot-skeleton-action"></span>
          </header>
          <div class="boot-skeleton-messages">
            <div class="boot-skeleton-message"><span class="skeleton boot-skeleton-avatar"></span><span class="boot-skeleton-copy"><span class="skeleton"></span><span class="skeleton"></span></span></div>
            <div class="boot-skeleton-message"><span class="skeleton boot-skeleton-avatar"></span><span class="boot-skeleton-copy"><span class="skeleton"></span><span class="skeleton"></span></span></div>
            <div class="boot-skeleton-message"><span class="skeleton boot-skeleton-avatar"></span><span class="boot-skeleton-copy"><span class="skeleton"></span><span class="skeleton"></span></span></div>
          </div>
          <div class="skeleton boot-skeleton-composer"></div>
        </main>
      </div>
    </div>

    <!-- Two regions, because a failure and a confirmation do not deserve the
         same urgency: errors interrupt, everything else waits its turn. -->
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="toasts toasts-alert" id="toasts-alert" role="alert"
      aria-live="assertive"></div>
    <div id="layer-root"></div>
    <dialog class="modal" id="modal"></dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
