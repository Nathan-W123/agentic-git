<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download KUMI</title>
    <meta
      name="description"
      content="KUMI for Mac, Windows and Linux — the same control room, in its own window."
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .dl-page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      .dl-card {
        width: min(460px, 100%);
        display: grid;
        gap: 18px;
        padding: 30px 26px;
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        border-radius: 18px;
        box-shadow: var(--shadow-pop);
        text-align: center;
      }
      .dl-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 16px;
      }
      .dl-card h1 {
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .dl-lede {
        color: var(--text-3);
        font-size: 13.5px;
        line-height: 1.55;
      }
      .dl-primary {
        justify-content: center;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
      }
      .dl-alt {
        min-height: 17px;
        color: var(--text-4);
        font-size: 12px;
      }
      .dl-all {
        text-align: left;
        border-top: 1px solid var(--border-soft);
        padding-top: 14px;
      }
      .dl-all summary {
        cursor: pointer;
        color: var(--text-3);
        font-size: 12.5px;
        list-style: none;
      }
      .dl-all summary::-webkit-details-marker {
        display: none;
      }
      .dl-all summary::before {
        content: "▸ ";
      }
      .dl-all[open] summary::before {
        content: "▾ ";
      }
      .dl-all ul {
        display: grid;
        gap: 7px;
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12.5px;
      }
      .dl-all li {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: baseline;
      }
      .dl-all span {
        color: var(--text-4);
      }
      .dl-note {
        color: var(--text-4);
        font-size: 11.5px;
        line-height: 1.5;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main class="dl-page">
      <section class="dl-card">
        <img class="dl-logo" src="/kumi-logo.png" alt="" />
        <div>
          <h1>KUMI for desktop</h1>
          <p class="dl-lede">
            The same control room, in its own window. It signs in to this
            deployment through your browser — nothing to copy, paste, or
            configure.
          </p>
        </div>

        <a class="btn btn-primary dl-primary" id="primary" href="#">
          Choose a download
        </a>
        <p class="dl-alt" id="alt"></p>

        <details class="dl-all">
          <summary>All downloads</summary>
          <ul id="all"></ul>
        </details>

        <p class="dl-note" id="note"></p>
        <p class="dl-note">
          <a href="/">Or open KUMI in this browser</a> — the app is a window
          onto the same deployment, not a different one.
        </p>
      </section>
    </main>

    <script type="module" src="/download.js"></script>
  </body>
</html>
