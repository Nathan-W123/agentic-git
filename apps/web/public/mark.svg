<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The same mark as `brandMark` in ui.js, with two differences forced by
    being a file rather than inline markup: it cannot read `currentColor`,
    and it has no page to inherit a background from. So the strokes are a
    fixed near-white and the disc behind them is drawn here — a favicon is
    composited onto a browser chrome whose colour this cannot know, and a
    bare white knot disappears against a light tab strip.
  -->
  <rect width="48" height="48" rx="11" fill="#1a1a1a"/>
  <mask id="weave" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
    <rect width="48" height="48" fill="#fff"/>
    <rect x="9" y="17.5" width="30" height="13" rx="6.5"
      transform="rotate(-45 24 24)" fill="none" stroke="#000" stroke-width="7"/>
  </mask>
  <rect x="9" y="17.5" width="30" height="13" rx="6.5"
    transform="rotate(45 24 24)" mask="url(#weave)" stroke="#ededed"
    stroke-width="3.2"/>
  <rect x="9" y="17.5" width="30" height="13" rx="6.5"
    transform="rotate(-45 24 24)" stroke="#ededed" stroke-width="3.2"/>
</svg>
