<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The K of the KUMI wordmark, the same badge `brandMark` in ui.js shows in
    a square slot, with two differences forced by being a file rather than
    inline markup: it cannot read `currentColor`, and it has no page to
    inherit a background from. So the letter is a fixed near-white and the
    tile behind it is drawn here — a favicon is composited onto a browser
    chrome whose colour this cannot know, and a bare white letter disappears
    against a light tab strip.
  -->
  <rect width="48" height="48" rx="11" fill="#1a1a1a"/>
  <g stroke="#ededed" stroke-width="6.6" stroke-linecap="butt"
    stroke-linejoin="miter">
    <path d="M8.3 8V40"/>
    <path d="M42 11 13.5 24 42 37"/>
  </g>
</svg>
