<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve app · Kumi</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .authorize-page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .authorize-card {
        width: min(420px, 100%);
        display: grid;
        gap: 16px;
        padding: 26px 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        box-shadow: var(--shadow-pop);
      }
      .authorize-card h1 {
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .authorize-card p {
        color: var(--text-3);
        font-size: 13px;
        line-height: 1.5;
      }
      .authorize-app {
        padding: 10px 12px;
        background: var(--bg-inset);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 550;
        word-break: break-word;
      }
      .authorize-grants {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 18px;
        color: var(--text-3);
        font-size: 12.5px;
      }
      .authorize-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .authorize-note {
        color: var(--text-4);
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <main class="authorize-page">
      <section class="authorize-card">
        <h1 id="heading">Approve this app?</h1>
        <div class="authorize-app" id="app-name">A Kumi app</div>
        <p id="detail">
          It will sign in as you on this machine, and you can revoke it any
          time in Settings → Advanced.
        </p>
        <ul class="authorize-grants">
          <li>Read your projects, channels, and agents</li>
          <li>Start and follow work, the same as this browser</li>
        </ul>
        <p class="authorize-note" id="note"></p>
        <div class="authorize-actions">
          <button class="btn" id="cancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="approve" type="button">
            Approve
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/authorize.js"></script>
  </body>
</html>
